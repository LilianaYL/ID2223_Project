name: currency-prediction

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  schedule_pipelines:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      contents: write

    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: execute python workflows from bash script
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          ipython 2_currency_feature_pipeline.ipynb
          ipython 4_currency_batch_inference.ipynb
     
      - name: github pages publish
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Currency Prediction Dashboard published"
          commit_options: '--no-verify --signoff'
          push_options: '--force'

          file_pattern: 'docs/exchange-rate/assets/img/*'

          repository: .

          status_options: '--untracked-files=all' #changed from no

          skip_dirty_check: true
          skip_fetch: true
          skip_checkout: true

          
